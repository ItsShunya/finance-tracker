# Layout of the dashboards. The charts themselves are in dashboards.js, `chart:`
# picks which one a panel shows.
#
# Monthly shows the last month of the time filter, or the latest month if there
# is no filter.

# Reused below with `<<: *name`.
templates:
  echarts: &echarts
    type: echarts
    script: &render "return utils.render({ ext, ledger, helpers, panel });"
  html: &html
    type: html
    script: *render
  sankey: &sankey
    type: d3_sankey
    script: *render
  kpis: &kpis
    <<: *html
    width: 100%
    height: 120px
  half: &half
    <<: *echarts
    width: 50%
    height: 380px
  full: &full
    <<: *echarts
    width: 100%
    height: 420px

dashboards:
  # ---------------------------------------------------------------------------
  - name: Overview
    panels:
      - title: Overview
        chart: overviewKpis
        <<: *kpis
        link: ../../balance_sheet/?conversion=at_value

      - title: Net Worth, Assets & Liabilities
        chart: netWorthTrend
        <<: *full
        link: ../../balance_sheet/?conversion=at_value

      - title: Assets by Type
        chart: assetsComposition
        <<: *half

      - title: Liabilities by Type
        chart: liabilitiesComposition
        <<: *half

      - title: Monthly Change in Net Worth
        chart: netWorthChange
        <<: *half

      - title: Current Asset Allocation
        chart: assetAllocation
        <<: *half

      - title: Income vs. Expenses
        chart: incomeVsExpenses
        <<: *full
        link: ../../income_statement/

      - title: Monthly Profit & Loss
        chart: profitLoss
        <<: *full
        link: ../../income_statement/

      - title: Savings Rate
        chart: savingsRate
        <<: *half

      - title: Yearly Summary
        chart: yearlySummary
        <<: *half

      - title: Net Savings Heatmap
        chart: savingsHeatmap
        <<: *full
        height: 360px

      - title: Expenses by Category
        chart: expenseTrend
        <<: *full
        link: ../../account/Expenses/

  # ---------------------------------------------------------------------------
  - name: Monthly
    panels:
      - title: Month at a Glance
        chart: monthKpis
        <<: *kpis
        height: 140px

      - title: Where the Money Went
        chart: expenseTreemap
        <<: *half
        height: 440px

      - title: Categories vs. Average Month
        chart: categoryVsAverage
        <<: *half
        height: 440px

      - title: Money Flow
        chart: moneyFlow
        <<: *sankey
        width: 100%
        height: 520px

      - title: Spending Pace (cumulative)
        chart: spendingPace
        <<: *half

      - title: Top Payees
        chart: topPayees
        <<: *half

      - title: Largest Expenses
        chart: largestExpenses
        <<: *html
        width: 50%
        height: 380px

      # Budgets are only available server-side, hence the Jinja template.
      - title: Budgets
        width: 50%
        height: 380px
        type: jinja2
        queries:
          - bql: |
              SELECT account, CONVERT(SUM(position), '{{ ledger.ccy }}') AS value
              WHERE account ~ '^Expenses:' AND date >= {{ ledger.dateLast.replace(day=1) }}
              GROUP BY account
        template: |
          {%- set first = ledger.dateLast.replace(day=1) -%}
          {%- set next = first.replace(year=first.year + 1, month=1) if first.month == 12 else first.replace(month=first.month + 1) -%}
          {%- set elapsed = ((ledger.dateLast - first).days + 1) / (next - first).days -%}
          {%- set accounts = favaledger.all_entries_by_type.Custom | selectattr("type", "equalto", "budget")
                | map(attribute="values") | map("first") | map(attribute="value") | unique | sort -%}
          <div style="height: 100%; overflow: auto;">
          {%- for account in accounts -%}
            {%- set budget = favaledger.budgets.calculate_children(account, first, next).get(ledger.ccy, 0) -%}
            {%- set ns = namespace(spent=0) -%}
            {%- for row in panel.queries[0].result if row.account == account or row.account.startswith(account ~ ":") -%}
              {%- set ns.spent = ns.spent + row.value.get_currency_units(ledger.ccy).number -%}
            {%- endfor -%}
            {%- set used = (ns.spent / budget) if budget else 0 -%}
            {%- set color = "#d03b3b" if used > 1 else ("#fab219" if used > elapsed else "#0ca30c") -%}
            <div style="margin-bottom: 14px;">
              <div style="display: flex; justify-content: space-between;">
                <a href="../../account/{{ account }}/?time={{ first.strftime('%Y-%m') }}"><strong>{{ account.split(":")[1:] | join(":") }}</strong></a>
                <span>{{ ns.spent | format_currency(ledger.ccy, show_if_zero=True) }} / {{ budget | format_currency(ledger.ccy) }} {{ ledger.ccy }}</span>
              </div>
              <div style="height: 10px; border-radius: 5px; background: var(--background-darker); margin: 4px 0;">
                <div style="width: {{ [used * 100, 100] | min }}%; height: 100%; border-radius: 5px; background: {{ color }};"></div>
              </div>
              <div style="font-size: 12px; color: var(--text-color-lighter);">
                {{ "✕ Over budget" if used > 1 else ("! Ahead of pace" if used > elapsed else "✓ On track") }}
                · {{ "%.0f" | format(used * 100) }}% used, {{ "%.0f" | format(elapsed * 100) }}% of the month gone
              </div>
            </div>
          {%- endfor -%}
          </div>

utils:
  # Relative to main.bean, not to this file.
  path: ../dashboards/dashboards.js
