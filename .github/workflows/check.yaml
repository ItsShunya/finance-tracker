name: Check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Lint and load importers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # ledger/ and documents/ are private, so this only checks that
      # config.py and the importers load.
      - name: Load importers
        run: uv run config.py identify tests

  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          push: false

  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Flake check
        run: nix flake check --all-systems

      # numpy and friends need the libraries the shell provides, so make sure
      # the importers still load from inside it.
      - name: Load importers in the dev shell
        run: nix develop --command bash -c "uv sync --locked && uv run config.py identify tests && make help"
